# Routing settings for the locoder/routing plugin. Linked into the Hermes home
# as routing.yaml; re-read on every tool call, so edits apply without restart.
# Anything left out falls back to the defaults in plugins/locoder/routing/settings.py.

llama:
  base_url: http://127.0.0.1:8088/v1
  # The CPU-only preset in llama/presets.ini. Never point this at orchestrator
  # or coder: both run one slot, and a judge query would evict their KV cache.
  judge_model: judge
  timeout_s: 30

policy:
  # Claude Code is the default. The local coder goes first only when the judge
  # is near-certain: P(coder finishes) >= local_threshold AND expected
  # difficulty (0 trivial .. 3 heavy) <= local_max_difficulty. A wrong "coder"
  # costs minutes (the chain moves on to Claude Code); a wrong "claude" costs
  # quota. Tune these from `make report` once the ledger has a few weeks in it.
  local_threshold: 0.85
  local_max_difficulty: 0.5
  # While a limit has Claude Code locked out, the coder is tried before
  # OpenRouter when P(coder finishes) >= fallback_threshold.
  fallback_threshold: 0.3

claude:
  bin: claude
  max_turns: 15
  timeout_s: 1800
  allowed_tools: [Read, Edit, Write, Bash, Grep, Glob]
  workdir_roots: [/srv/data/projects]
  # When your Max weekly window resets (0 = Monday .. 6 = Sunday, local time).
  # Check it in Claude Code with /usage. Results are grouped by this week.
  week:
    reset_weekday: 0
    reset_hour: 9
    timezone: Europe/Warsaw
  # A limit error is read for its reset time, and Claude Code is skipped until
  # then. When the error names no readable time, it is skipped this long; the
  # next task after that tries again and re-locks if the limit still holds.
  limit_fallback_s: 3600
  result_chars: 8000

# The last resort: a one-shot run of this Hermes profile on an OpenRouter model,
# via the `openrouter` custom provider in config.yaml (OPENROUTER_API_KEY in .env).
openrouter:
  enabled: true
  hermes_bin: locoder
  provider: custom:openrouter
  # A placeholder until the bake-off picks one. Use a concrete model id: Hermes
  # prices runs from OpenRouter's model list, and an unlisted id costs "unknown".
  # Without a TTY, Hermes refuses models over $20/M input or $100/M output.
  model: deepseek/deepseek-v4.1-flash
  # No delegate_task, clarify or routing tools: the run is the worker.
  toolsets: file,terminal,web,todo
  timeout_s: 1800
