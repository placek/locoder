web:
  # Every web_extract call goes through Defuddle (plugins/web/defuddle/), which
  # strips a page to its main content instead of handing the model a nav-and-
  # sidebar dump. Fewer tokens, and quotes that come from the article body.
  #
  # Safe to pin: an explicitly configured backend wins even when it is
  # unavailable, but a whole-batch failure triggers Hermes' one-shot keyless
  # rescue, so a missing binary degrades to the keyless ring instead of
  # breaking web_extract. Search is untouched (Defuddle is extract-only).
  extract_backend: defuddle

  # Per-URL wall clock for the defuddle CLI; it fetches the page itself, so this
  # covers network + parse.
  defuddle_timeout: 60
  # Explicit binary path. Unset = $HERMES_DEFUDDLE_BIN, then $PATH, then
  # ~/.hermes/tools/defuddle/node_modules/.bin/defuddle.
  defuddle_bin: ''
  # User-Agent defuddle fetches with. Sites that fingerprint the default Node
  # UA answer 403 (Medium and most CDN-fronted blogs); the provider sends a
  # browser UA by default. Set to '' to send no --user-agent flag at all.
  # defuddle_user_agent: 'Mozilla/5.0 ...'

  # One-shot retry on the keyless ring when the pinned backend fails a call.
  keyless_fallback: true
  keyless_rescue: true

security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true

_config_version: 46
timezone: Europe/Warsaw
browser:
  use_real_profile: false
