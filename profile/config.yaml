# ─────────────────────────────────────────────────────────────────────────────
# Everything below is tuned for one job: being a coding agent driven by the
# skills in this repository (skills/, surfaced as /ship, /tdd, /verify, ...).
# The model + custom_providers blocks above are deliberately left untouched.
# ─────────────────────────────────────────────────────────────────────────────

# Hermes runs on the host; the commands the agent runs do not. Every terminal()
# call executes in the locoder-sandbox container (sandbox/Dockerfile, built by
# `make install`). Projects are mounted at the SAME path as on the host, so a
# workdir the agent sees is a workdir escalate() can hand to Claude Code.
terminal:
  backend: docker
  cwd: /srv/data/projects
  temp_dir: ''
  docker_image: locoder-sandbox:local
  docker_volumes:
    - /srv/data/projects:/srv/data/projects
  # Files the agent writes stay owned by you, not root.
  docker_run_as_host_user: true
  docker_mount_cwd_to_workspace: false
  # One long-lived container per profile: installs and caches survive between sessions.
  docker_persist_across_processes: true
  docker_network: true

  font_family: JetBrains Mono

# Rewind is a coding agent's safety net: it makes the tdd/refactor skills'
# "revert on red" cheap instead of a git surgery session.
checkpoints:
  enabled: true

display:
  compact: true
  interface: tui
  skin: charizard
  tui_status_indicator: unicode
  details_mode: collapsed
  sections:
    thinking: expanded
    tools: expanded
    subagents: collapsed
    activity: collapsed
  mouse_tracking: all

agent:
  # "focus" = coding brief + live git/workspace snapshot in the system prompt,
  # toolset collapsed to the lean coding set, and non-coding skill categories
  # demoted to names-only. The deny-list in agent/coding_context.py is explicit
  # (apple, creative, productivity, ...), so this repo's custom skills keep
  # their full descriptions while the noise shrinks.
  coding_context: focus

  # Standing operator rules, appended to the coding brief as a stable system
  # block. This is where the repo's workflow becomes the agent's default.
  # Cache-safe: edits take effect on the NEXT session.
  coding_instructions:
    - "Skills in skills/ are the house method, not suggestions. Before acting, check whether one covers the task and load it (skill_view). If one applies, use it."
    - "Whole feature, loose idea -> /ship. It sequences the rest (grill -> spec -> tickets -> failing acceptance tests -> implement -> verify -> document -> report) and resumes from .todo/<feature>/."
    - "Writing code for a feature or bugfix -> /tdd first: red test, then green. Never write implementation before the failing test exists."
    - "Behaviour-preserving cleanup -> /refactor. Green before, green after, revert on red. Never mix a refactor and a behaviour change in one step."
    - "Hard bug or perf regression -> /diagnosing-bugs. Build the feedback loop before proposing a fix; no speculative patches."
    - "Never claim done, fixed, passing, or ready without /verify: run the command, read the output, then say it. 'Should pass' and 'looks right' are not evidence."
    - "Issues live as markdown in .todo/ at the project root, committed with the code. Update a ticket's Status: line as you work; never delete or move issue files."
    - "Find work with: grep -rl '^Status: ready-for-agent' .todo"
    - "Read before you patch. Match the surrounding code's idiom, naming, and comment density rather than importing your own style."
    - "Minimal diffs. Solve the stated problem; no speculative abstractions or drive-by refactors unless asked."
    - "Handing work to a fresh agent -> /to-agent (writes the handoff doc). Reporting to a person -> /to-report. The skill is named to-agent because Hermes owns the built-in /handoff command."
    - "IMPLEMENTATION GOES THROUGH /delegate. Surgical edits of a few lines you make yourself; anything bigger, write the brief (goal, files or seam, the exact acceptance command, 'touch nothing else'), call route(brief) once, and start where it says: the local coder subagent, or escalate() to Claude Code / OpenRouter. If an attempt fails its acceptance check, move to the next rung in the chain route() returned. Never pick the rung by feel, and never call claude from the terminal: escalate() is the only path, because it paces the weekly Max limit and falls back to OpenRouter when it runs out."
    - "After EVERY delegated attempt, run the acceptance check yourself and call route_outcome(decision_id, rung, verified). The report that comes back is a claim, not evidence; /verify still applies. Unrecorded outcomes are lost training data for the routing."
    - "Keep the outer loop yourself. You decide the plan, the tickets, and the gates; the coder or Claude Code executes a bounded slice. Never hand either of them /ship, an unscoped 'make it work', or the decision about whether something is done."
    - "Research is available and keyless: web_search finds sources, web_extract reads the page. Use /research for anything non-trivial (it runs in the background and writes a cited file). Never answer a factual or API question from memory when a primary source is one search away, and cite what you actually read rather than the search snippet."
    - "Default to web_research(query): one call that searches AND returns the top pages as clean markdown, main content only. Use plain web_search only when you want a list of links you do not intend to read, and web_extract when you already have the URL."
    - "A search snippet is a lead, not a source. Never quote, cite, or rely on a result you have not opened — web_research already fetched it, so read the content field rather than the description."

  # Forced true, NOT "auto". "auto" substring-matches the model NAME against
  # ("gpt","codex","grok","deepseek","kimi","qwen","glm",...) — the models here
  # are named "coder"/"orchestrator", which match nothing, so "auto" would
  # silently leave both blocks OFF. Local models need this discipline most:
  # tool persistence, tools instead of prose, read-back after writes,
  # count reconciliation, literal identifiers, verification-gated completion.
  tool_use_enforcement: true
  execution_guidance: true

  # "auto" only covers the codex_responses api_mode. true re-prompts whenever
  # the model narrates an action ("I'll run the tests...") without calling a
  # tool — the classic local-model stall.
  intent_ack_continuation: true

  # Anti-stall + finish-the-job + batched-reads guidance. Cheap, all on.
  stall_guards: true
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true

  # Verification closure: after code edits, refuse a final answer until fresh
  # evidence exists or the agent says why it can't check. This is the runtime
  # enforcement of the /verify skill. "auto" = on for interactive coding
  # surfaces and programmatic callers, off for messaging. Doc/skill-only edits
  # never fire it.
  verify_on_stop: auto
  verify_guidance: true
  max_verify_nudges: 3

  # Local models spin. 180s status pings surface a stuck run before a /restart.
  gateway_notify_interval: 180

delegation:
  model: coder
  provider: llama-router
  base_url: http://127.0.0.1:8088/v1
  max_spawn_depth: 2
  orchestrator_enabled: true
  # MUST equal the coder preset's `parallel` in llama/presets.ini (1). Children
  # beyond the server's slot count do not run in parallel: they queue, and each
  # one's request evicts the others' KV cache from the single slot, so every
  # turn re-reads its whole context. 3 here was slower than 1, not faster.
  max_concurrent_children: 1
  max_summary_chars: 16000
  max_iterations: 60
  # Leave false to keep a human in the loop on spawns. Set true if you want
  # /ship to run fully unattended after its three gates.
  subagent_auto_approve: false
  inherit_mcp_toolsets: true

skills:
  # This profile's skills/ dir is a symlink to this repo's skills/, so the
  # repo IS the local skill tier: every skill is a /slash command, and the
  # agent can improve its own skills in git. The profile is created with
  # --no-skills (a .no-bundled-skills marker), so `hermes update` never syncs
  # bundled skills over the top of the checkout.
  #
  # If you'd rather keep the repo strictly read-only, drop the symlink and use:
  #   external_dirs:
  #     - /srv/data/projects/placek/skills/skills
  #
  # Extra read-only scan roots. Path is relative to HERMES_HOME (the profile), so
  # this resolves per-profile and is silently skipped where the dir doesn't exist.
  # `bundled-skills/` holds the hermes-agent self-documentation skill that
  # `profile create` seeds — kept out of skills/ because that's now the repo.
  #
  # A scan root may itself BE a symlink, but a symlinked SUBDIRECTORY inside a
  # scan root is invisible: discovery is Path.rglob("**/SKILL.md"), which refuses
  # to descend into symlinked dirs. Link whole roots, never individual skills.
  external_dirs:
    - bundled-skills

  # Per-project skills at <root>/.hermes/skills/ or <root>/.agents/skills/ load
  # as the highest-precedence tier, but only for roots you `hermes skills trust`.
  project_discovery: true
  trusted_project_dirs: []

  # Pinned fully-loaded in every session. verify is 2.3 KB and is the one rule
  # that must never be a recall miss: no completion claim without evidence.
  # delegate is the other: it is the only path to the coder and the paid rungs,
  # and a recall miss means work silently done by feel instead of by route().
  # Keep this list tiny — the full skills/ tree is ~107 KB (~27k tokens) against
  # a 65k context, so everything else stays description-only until loaded.
  auto_load:
    - verify
    - delegate

  # ${HERMES_SKILL_DIR} / ${HERMES_SESSION_ID} substitution in SKILL.md.
  template_vars: true

  # No skill in this repo uses !`cmd` snippets, so leaving this off costs
  # nothing and keeps skill-authored shell from running on the host unapproved.
  inline_shell: false

  # The agent edits its own skills here, and they're in git — the ledger gives
  # `hermes curator ledger` / `rollback`, and git gives the rest. No staging
  # gate, so /writing-for-agents edits land without a round trip.
  write_approval: false
  ledger: true

  disabled: []

plugins:
  enabled:
    # (model-providers/claude-code was listed here before; no such plugin exists
    # in Hermes, so it was a silent no-op. Claude Code is reached through the
    # routing plugin's escalate() tool instead.)
    - model-providers/openrouter
    # Web research backends for the /research skill. web_search + web_extract
    # both work keyless via the Keenable free tier (enabled by default, not
    # listed here); tavily and firecrawl join the keyless ring so a rate-limit
    # or outage on one provider doesn't take research down, and firecrawl adds
    # stronger content extraction for reading primary sources.
    # Set TAVILY_API_KEY / FIRECRAWL_API_KEY in the profile .env for higher limits.
    - web/tavily
    - web/firecrawl
    # Local user plugin (plugins/web/defuddle/ in this repo, symlinked to the
    # profile's plugins/ dir). Pinned as web.extract_backend below.
    - web/defuddle
    # Local user plugin (plugins/locoder/routing/): route, escalate,
    # route_outcome, routing_status. Settings live in routing.yaml beside this file.
    - locoder/routing
    # Keyless search, one more member of the rescue ring. Possible now that
    # Hermes lives in a uv venv (`make install` adds the ddgs extra); the old
    # Nix build shipped a sealed interpreter that could never import it.
    - web/ddgs
  disabled:
    - browser/browser_use
    - browser/browserbase
    - browser/firecrawl
    - cron_providers/chronos
    - dashboard_auth/basic
    - dashboard_auth/drain
    - dashboard_auth/nous
    - dashboard_auth/self_hosted
    - disk-cleanup
    - google_meet
    - image_gen/deepinfra
    - image_gen/fal
    - image_gen/krea
    - image_gen/openai
    - image_gen/openai-codex
    - image_gen/openrouter
    - image_gen/xai
    - model-providers/ai-gateway
    - model-providers/alibaba
    - model-providers/alibaba-coding-plan
    - model-providers/anthropic
    - model-providers/arcee
    - model-providers/azure-foundry
    - model-providers/bedrock
    - model-providers/copilot
    - model-providers/copilot-acp
    - model-providers/custom
    - model-providers/deepinfra
    - model-providers/deepseek
    - model-providers/fireworks
    - model-providers/gemini
    - model-providers/gmi
    - model-providers/huggingface
    - model-providers/kilocode
    - model-providers/kimi-coding
    - model-providers/minimax
    - model-providers/nous
    - model-providers/novita
    - model-providers/nvidia
    - model-providers/ollama-cloud
    - model-providers/openai-codex
    - model-providers/opencode-zen
    - model-providers/qwen-oauth
    - model-providers/stepfun
    - model-providers/upstage
    - model-providers/vertex
    - model-providers/xai
    - model-providers/xiaomi
    - model-providers/zai
    - observability/langfuse
    - observability/nemo_relay
    - platforms/a2a
    - platforms/buzz
    - platforms/dingtalk
    - platforms/discord
    - platforms/email
    - platforms/feishu
