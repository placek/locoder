description: "Defuddle extract backend + the `web_research` tool. Strips a page to its main content via the `defuddle` Node CLI (kepano/defuddle, the engine behind Obsidian Web Clipper), and adds a one-call search-and-read tool. No API key; pin with `web.extract_backend: defuddle`."
