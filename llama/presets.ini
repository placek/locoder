; llama.cpp router presets for locoder. Loaded with --models-preset; clients
; pick a section by the OpenAI "model" field (orchestrator, coder, judge).
; Paths are inside the container: the host's model directory is mounted at /models.
;
; Measurements below are from alpha (RTX 5080, 16 GB; 123 GiB RAM), carried over
; from the NixOS module this replaces.

[*]
n-gpu-layers = 99
flash-attn = on
jinja = true
; q4_0 (0.5625 B/element) rather than q8_0 (1.0625). KV geometry from the GGUFs:
; coder is 41 layers x 2 KV heads x 256 = 41,984 elements/token; orchestrator
; 48 x 8 x 128 = 98,304, i.e. 2.34x more per token. Halving the element size
; doubles the window on both for +357 MiB total. Viable only with flash-attn.
; If long-context fidelity degrades, set cache-type-k = q8_0 and drop the
; ctx-sizes to 98304 / 49152 (+890 MiB).
cache-type-k = q4_0
cache-type-v = q4_0
; mmap, not mlock: ~96 GB of weights are live, mostly CPU-side experts, and
; immich, Postgres, Docker and clamav share this RAM. mmap lets the kernel
; reclaim experts under pressure, at the cost of a slower first token after.
load-mode = mmap

[orchestrator]
; Sharded quant: llama.cpp is handed shard 1 (3.7 MB, metadata only) and finds
; 2 and 3 beside it.
model = /models/Laguna-S-2.1-UD-Q4_K_XL-00001-of-00003.gguf
; All experts on CPU: at ~73 GB this only fits by keeping every expert tensor
; off the GPU, leaving VRAM for dense/attention layers and the KV cache.
cpu-moe = true
; Not 32768: hermes-agent hard-codes MINIMUM_CONTEXT_LENGTH = 64000 and rejects
; any model below it. 3457 MiB of KV at q4_0.
ctx-size = 65536
parallel = 1
load-on-startup = true

[coder]
model = /models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf
; 35B total / 3B active MoE. Each layer moved off the GPU is worth ~464 MiB:
; 28 -> 10173 MiB, 36 -> 6459 MiB, 44 -> 4127. 36 leaves ~2500 MiB headroom for
; the desktop session with both presets resident; 28 made the orchestrator's KV
; allocation fail at startup.
n-cpu-moe = 36
; 2952 MiB of KV at q4_0. n_ctx_train is 262144; the ceiling here is VRAM.
ctx-size = 131072
; MUST equal delegation.max_concurrent_children in profile/config.yaml.
parallel = 1
; Speculative decoding from the model's own multi-token-prediction head.
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
load-on-startup = true

[judge]
; The routing judge: a small instruct model, CPU only, so asking it never
; touches VRAM or evicts the orchestrator's or coder's single KV slot. It only
; ever answers max_tokens=1 with logprobs, so a 4B-class model is plenty.
; Put the GGUF you choose at <models>/judge.gguf (a symlink within the model
; directory works).
model = /models/judge.gguf
n-gpu-layers = 0
; Briefs are short; one prefill per question.
ctx-size = 4096
parallel = 1
; Tiny on CPU; q4_0 KV would only cost accuracy for no gain.
cache-type-k = f16
cache-type-v = f16
; Leave cores for the orchestrator's CPU experts.
threads = 6
load-on-startup = true
