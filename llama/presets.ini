; llama.cpp router presets for trismegistos. Loaded with --models-preset; clients
; pick a section by the OpenAI "model" field (orchestrator, judge).
; Paths are inside the container: the host's model directory is mounted at /models.
;
; Hardware: alpha (RTX 5080, 16 GB; 123 GiB RAM). `make test` checks these
; against profile/config.yaml and profile/routing.yaml (scripts/stack.py).

[*]
flash-attn = on
jinja = true
; mmap, not mlock: ~73 GB of weights are live, mostly CPU-side experts, and
; immich, Postgres, Docker and clamav share this RAM. mmap lets the kernel
; reclaim experts under pressure, at the cost of a slower first token after.
load-mode = mmap
; No n-gpu-layers here: it would switch off --fit for every preset (see below).

[orchestrator]
; The only GPU model. It plans, and it is also the local worker: delegation.model
; in profile/config.yaml points delegate_task children at this preset, so the
; `coder` rung runs here, in the same slot, while the parent waits for it.
; 118B total / 8B active MoE. Sharded quant: llama.cpp is handed shard 1
; (metadata only) and finds 2 and 3 beside it.
model = /models/Laguna-S-2.1-UD-Q4_K_XL-00001-of-00003.gguf
; MUST equal model.context_length in profile/config.yaml. Hermes refuses models
; below 64000. Laguna S is hybrid: 36 of its 48 layers use a 512-token sliding
; window, so only the 12 full-attention layers (8 KV heads x 128) grow with the
; context: 24,576 elements/token, ~3.3 GB for 128k at q8_0, plus ~0.1 GB for the
; windowed layers. The startup log's "KV self size" lines are the real figure.
ctx-size = 131072
; q8_0, not q4_0: near-lossless attention across a long context, for about what
; 64k at q4_0 was budgeted. K and V must share a type: the official CUDA image
; is built without the mixed-type flash-attention kernels (GGML_CUDA_FA_ALL_QUANTS),
; and a mixed pair falls back to the CPU.
cache-type-k = q8_0
cache-type-v = q8_0
; MUST equal delegation.max_concurrent_children. One slot: a child runs while
; its parent waits on delegate_task, so they never need the model at once.
parallel = 1
; A child's turns push the parent's KV out of the slot. The RAM prompt cache
; saves it and restores it when the parent resumes, instead of re-reading ~100k
; tokens through CPU experts. Room for a few 128k stashes (~3.3 GB each).
cache-ram = 16384
; Expert placement is left to --fit (on by default), which is why nothing here
; or in [*] sets n-gpu-layers, cpu-moe, n-cpu-moe or override-tensor: any of
; them makes it step aside. At load it measures free VRAM, keeps as many expert
; layers on the GPU as still leave fit-target MiB free, and puts the rest in RAM.
; Nothing to hand-tune or get wrong, and it adapts to what the desktop is using.
; 2560 MiB is the headroom the desktop session was measured to need.
fit-target = 2560
; Poolside's recommended sampling for Laguna S 2.1. Hermes sends none to a
; custom provider, so these apply to every request.
temperature = 0.7
top-p = 0.95
top-k = 20
; Think before answering: slower, better. Hermes sends no thinking switch to a
; custom provider, so the server decides.
reasoning = on
; A local model caught in a reasoning loop never answers. 8192 tokens is far
; beyond a normal turn; at the budget llama.cpp closes the reasoning and the
; model has to answer.
reasoning-budget = 8192
load-on-startup = true

[judge]
; The routing judge: a small instruct model, CPU only, so asking it never
; touches VRAM or evicts the orchestrator's single KV slot. It only ever
; answers max_tokens=1 with logprobs, so a 4B-class model is plenty.
; Put the GGUF you choose at <models>/judge.gguf (a symlink within the model
; directory works).
model = /models/judge.gguf
n-gpu-layers = 0
; Placed by hand (nothing on the GPU), so --fit has nothing to do; off, it
; logs no "failed to fit" warning at every start.
fit = off
; Briefs are short; one prefill per question.
ctx-size = 4096
parallel = 1
; Tiny on CPU; a quantised KV would only cost accuracy for no gain.
cache-type-k = f16
cache-type-v = f16
; Leave cores for the orchestrator's CPU experts.
threads = 6
load-on-startup = true
